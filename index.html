
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLD Automóveis 3D</title>
<style>
body{margin:0;background:#080b12;color:white;font-family:Arial;text-align:center}
header{padding:22px;color:#f5bd36;font-size:27px;font-weight:bold}
p{color:#ddd}
canvas{width:100%;height:55vh;display:block;touch-action:pan-y}
button{background:#f5bd36;color:#111;border:0;border-radius:9px;padding:13px;margin:6px;font-weight:bold}
</style>
</head>
<body>
<header>GLD AUTOMÓVEIS</header>
<p>COMPRA • VENDA • FINANCIAMENTO</p>
<canvas id="carro"></canvas>
<h3>Vitrine 3D Interativa</h3>
<p>Arraste o dedo para girar o veículo.</p>
<button id="movimento">Ativar movimento do celular</button>
<button id="girar">Girar automaticamente</button>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#carro');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#111722');

const camera=new THREE.PerspectiveCamera(45,1,.1,100);
camera.position.set(5,3,7);
camera.lookAt(0,.7,0);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2));

const luz=new THREE.DirectionalLight(0xffffff,3);
luz.position.set(4,7,5);
scene.add(luz);

const carro=new THREE.Group();
scene.add(carro);

function caixa(w,h,d,cor,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:cor,metalness:.65,roughness:.3
  })
 );
 m.position.set(x,y,z);
 carro.add(m);
 return m;
}

caixa(2,.5,4,0xb9c1ce,0,.65,0);
caixa(1.5,.65,2,0x182a40,0,1.15,-.25);
caixa(1.8,.15,3.7,0xb9c1ce,0,.94,0);

for(const z of [-1.3,1.3]){
 for(const x of [-1.02,1.02]){
  const roda=new THREE.Mesh(
   new THREE.CylinderGeometry(.4,.4,.22,32),
   new THREE.MeshStandardMaterial({color:0x151515})
  );
  roda.rotation.z=Math.PI/2;
  roda.position.set(x,.45,z);
  carro.add(roda);

  const aro=new THREE.Mesh(
   new THREE.CylinderGeometry(.22,.22,.24,24),
   new THREE.MeshStandardMaterial({
    color:0xc7cbd2,metalness:.9
   })
  );
  aro.rotation.z=Math.PI/2;
  aro.position.set(x,.45,z);
  carro.add(aro);
 }
}

caixa(1.5,.12,.08,0xffffff,0,.7,2.02);
caixa(1.5,.12,.08,0xcc2222,0,.7,-2.02);

const chao=new THREE.Mesh(
 new THREE.CircleGeometry(5,64),
 new THREE.MeshStandardMaterial({color:0x252b35})
);
chao.rotation.x=-Math.PI/2;
chao.position.y=-.02;
scene.add(chao);

function ajustar(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}
new ResizeObserver(ajustar).observe(canvas);
ajustar();

let angulo=.5,auto=false,arrastando=false,xAnterior=0;
canvas.addEventListener('pointerdown',e=>{
 arrastando=true;xAnterior=e.clientX;
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(arrastando){
  angulo+=(e.clientX-xAnterior)*.012;
  xAnterior=e.clientX;
 }
});
canvas.addEventListener('pointerup',()=>arrastando=false);
canvas.addEventListener('pointercancel',()=>arrastando=false);

document.querySelector('#girar').onclick=()=>{
 auto=!auto;
 document.querySelector('#girar').textContent=
 auto?'Parar rotação':'Girar automaticamente';
};

document.querySelector('#movimento').onclick=async()=>{
 try{
  if(typeof DeviceOrientationEvent==='undefined'){
   alert('Sensor não disponível neste navegador.');
   return;
  }
  if(DeviceOrientationEvent.requestPermission){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=='granted')return;
  }
  window.addEventListener('deviceorientation',e=>{
   if(e.gamma!==null)angulo=e.gamma*.025;
  });
  alert('Sensor ativado, se permitido pelo navegador.');
 }catch(e){
  alert('Abra o app em uma página HTTPS e tente novamente.');
 }
};

function animar(){
 requestAnimationFrame(animar);
 if(auto&&!arrastando)angulo+=.008;
 carro.rotation.y=angulo;
 renderer.render(scene,camera);
}
animar();
</script>
</body>
</html>
