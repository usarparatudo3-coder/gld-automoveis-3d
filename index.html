
<section id="suv3d" style="background:#111;color:white;padding:20px;border-radius:16px;text-align:center;margin:20px 0">
  <h2>🚙 SUV 3D</h2>
  <p>Arraste o dedo para girar o veículo</p>
  <div id="suv-viewer" style="width:100%;height:320px;overflow:hidden;border-radius:12px;background:linear-gradient(#293747,#101318)">
    <div id="suv-model" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:800px;touch-action:pan-y">
      <svg id="suv-car" viewBox="0 0 400 220" style="width:100%;max-width:420px;transform:rotateY(0deg);transition:transform .12s" aria-label="Ilustração de SUV em 3D">
        <defs>
          <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e8edf2"/>
            <stop offset="45%" stop-color="#687989"/>
            <stop offset="100%" stop-color="#202a35"/>
          </linearGradient>
        </defs>
        <ellipse cx="200" cy="177" rx="150" ry="17" fill="#000" opacity=".5"/>
        <path d="M45 145 L58 112 Q65 101 96 97 L139 58 Q151 48 178 48 L243 54 Q260 57 278 83 L323 104 Q343 110 350 132 L354 151 L336 164 L64 164 L43 155Z" fill="url(#paint)" stroke="#c6d0d9" stroke-width="2"/>
        <path d="M110 94 L148 62 Q157 57 178 58 L181 94Z" fill="#9ed6e8" stroke="#182c3b" stroke-width="4"/>
        <path d="M190 59 L239 64 Q253 67 266 92 L190 94Z" fill="#9ed6e8" stroke="#182c3b" stroke-width="4"/>
        <path d="M188 58 L188 145" stroke="#1b2732" stroke-width="5"/>
        <path d="M69 116 L104 111 L96 129 L59 134Z" fill="#fff3bf"/>
        <path d="M320 116 L338 126 L342 137 L323 134Z" fill="#ff4949"/>
        <path d="M48 146 L353 146 L350 159 Q347 169 332 169 L70 169 Q51 168 48 156Z" fill="#303b46"/>
        <circle cx="112" cy="160" r="29" fill="#101318" stroke="#707b85" stroke-width="5"/>
        <circle cx="112" cy="160" r="14" fill="#c5cdd4" stroke="#535e69" stroke-width="4"/>
        <circle cx="294" cy="160" r="29" fill="#101318" stroke="#707b85" stroke-width="5"/>
        <circle cx="294" cy="160" r="14" fill="#c5cdd4" stroke="#535e69" stroke-width="4"/>
        <path d="M143 107 L176 107 M207 107 L253 107" stroke="#e4eaf0" stroke-width="2" opacity=".7"/>
      </svg>
    </div>
  </div>
  <button onclick="document.getElementById('suv-car').style.transform='rotateY(0deg)'" style="padding:12px 20px;margin:12px 5px;border:0;border-radius:8px">Vista inicial</button>
  <p style="font-size:12px;color:#b9c2cc">Modelo demonstrativo ilustrado</p>
</section>
<script>
(function(){
 const view=document.getElementById('suv-model');
 const car=document.getElementById('suv-car');
 let start=0, angle=0, active=false;
 view.addEventListener('pointerdown',function(e){start=e.clientX;active=true;view.setPointerCapture(e.pointerId)});
 view.addEventListener('pointermove',function(e){if(!active)return;angle+=(e.clientX-start)*0.9;start=e.clientX;car.style.transform='rotateY('+angle+'deg)'});
 view.addEventListener('pointerup',function(){active=false});
 view.addEventListener('pointercancel',function(){active=false});
})();
</script>
